name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0" # hold i takt med packageManager i package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:ci
      # Sekvensielt + stor heap: tsc for web (Payload-typene) trenger >4 GB,
      # og parallelle tsc-prosesser med stor heap OOM-dreper runneren (16 GB)
      - run: bun run typecheck --concurrency=1
        env:
          NODE_OPTIONS: --max-old-space-size=12288
      - run: bun run test
